<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Queue Management System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        .otp-input {
            width: 100%;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #2c3e50;
        }
        .otp-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="card">
            <div class="header">
                <div class="logo">🔐</div>
                <h1 class="title">Verify OTP</h1>
                <p class="subtitle">Enter the verification code sent to your email</p>
            </div>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="alert alert-error">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'otp' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="otp">Enter OTP</label>
                    <input type="text" id="otp" name="otp" class="otp-input" placeholder="000000" maxlength="6" required>
                </div>

                <input type="hidden" name="action" value="verify">
                <button type="submit" class="btn btn-primary btn-full">Verify OTP</button>
            </form>

            <form method="POST" action="{% url 'otp' %}" style="margin-top: 15px;">
                {% csrf_token %}
                <input type="hidden" name="action" value="resend">
                <button type="submit" class="btn btn-secondary btn-full">Resend OTP</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'register' %}" class="btn btn-secondary btn-full">← Back to Registration</a>
                <a href="{% url 'index' %}" class="btn btn-secondary btn-full">Home</a>
            </div>
        </div>
    </div>

    <script>
        // Auto-focus on OTP input
        document.getElementById('otp').focus();
        
        // Only allow numbers in OTP input
        document.getElementById('otp').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
